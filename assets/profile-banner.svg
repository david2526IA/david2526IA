<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">David — AI Systems and Robotics</title>
  <desc id="desc">Perfil técnico de inteligencia artificial, robótica y sistemas de datos</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050b16"/>
      <stop offset="0.58" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#09262d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#35d0b4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8eb8e8" stroke-width="1" opacity=".07"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>

  <rect width="1280" height="360" rx="22" fill="url(#background)"/>
  <rect width="1280" height="360" rx="22" fill="url(#grid)"/>
  <ellipse cx="1085" cy="170" rx="235" ry="175" fill="#1b71c9" opacity=".08" filter="url(#soft)"/>

  <!-- System topology -->
  <g transform="translate(58 52)" font-family="Consolas,Menlo,monospace">
    <rect width="286" height="256" rx="16" fill="#07111f" stroke="#284868"/>
    <circle cx="22" cy="22" r="4" fill="#ff6b6b"/>
    <circle cx="37" cy="22" r="4" fill="#f4c95d"/>
    <circle cx="52" cy="22" r="4" fill="#46d39a"/>
    <text x="73" y="27" fill="#7894b4" font-size="12">SYSTEM.PIPELINE</text>
    <path d="M32 61H254 M32 108H254 M32 155H254 M32 202H254" stroke="#24415f"/>
    <path d="M66 61V202 M143 61V202 M220 61V202" stroke="#24415f"/>
    <g fill="#0d2137" stroke="#4c8ee8" stroke-width="1.5">
      <rect x="36" y="48" width="60" height="26" rx="5"/>
      <rect x="113" y="95" width="60" height="26" rx="5"/>
      <rect x="190" y="142" width="60" height="26" rx="5"/>
      <rect x="113" y="189" width="60" height="26" rx="5"/>
    </g>
    <g fill="#bcd7f4" font-size="10" text-anchor="middle">
      <text x="66" y="65">VOICE</text>
      <text x="143" y="112">RAG</text>
      <text x="220" y="159">LLM</text>
      <text x="143" y="206">ROBOT</text>
    </g>
    <g fill="#35d0b4">
      <circle cx="66" cy="108" r="4"/><circle cx="143" cy="155" r="4"/>
      <circle cx="220" cy="202" r="4"/><circle cx="220" cy="61" r="4"/>
    </g>
  </g>

  <!-- Identity -->
  <g transform="translate(397 66)" font-family="Segoe UI,Inter,Arial,sans-serif">
    <text x="0" y="76" fill="#fff" font-size="72" font-weight="700" letter-spacing="-2">DAVID</text>
    <rect x="2" y="96" width="618" height="4" rx="2" fill="url(#accent)"/>
    <text x="2" y="145" fill="#d9e7f6" font-size="27" font-weight="600" letter-spacing="2">AI SYSTEMS · ROBOTICS · DATA ENGINEERING</text>
    <text x="2" y="194" fill="#91a9c3" font-family="Consolas,Menlo,monospace" font-size="19">LOCAL_LLM  /  VOICE  /  RAG  /  COMPUTER_VISION</text>
    <g transform="translate(2 225)" font-family="Consolas,Menlo,monospace" font-size="13">
      <rect width="202" height="31" rx="5" fill="#0c2237" stroke="#254e73"/>
      <text x="14" y="21" fill="#54c9b5">STATUS</text><text x="78" y="21" fill="#c4d7ea">BUILDING_REAL_SYSTEMS</text>
    </g>
  </g>

  <!-- Technical telemetry -->
  <g transform="translate(1055 61)" font-family="Consolas,Menlo,monospace">
    <path d="M0 0H165V238H0" fill="#07111f" opacity=".58" stroke="#294968"/>
    <text x="17" y="29" fill="#6f8ca9" font-size="11">RUNTIME</text>
    <text x="17" y="58" fill="#35d0b4" font-size="12">● ONLINE</text>
    <text x="17" y="92" fill="#6f8ca9" font-size="10">INFERENCE</text>
    <rect x="17" y="103" width="126" height="5" rx="2" fill="#17324c"/>
    <rect x="17" y="103" width="96" height="5" rx="2" fill="#4f8cff"/>
    <text x="17" y="137" fill="#6f8ca9" font-size="10">RETRIEVAL</text>
    <rect x="17" y="148" width="126" height="5" rx="2" fill="#17324c"/>
    <rect x="17" y="148" width="110" height="5" rx="2" fill="#35d0b4"/>
    <text x="17" y="182" fill="#6f8ca9" font-size="10">HARDWARE</text>
    <path d="M17 212 L35 198 L53 205 L71 178 L89 192 L107 170 L125 181 L143 158" fill="none" stroke="url(#accent)" stroke-width="2"/>
  </g>

  <rect x="0" y="348" width="1280" height="12" rx="0 0 22 22" fill="url(#accent)" opacity=".75"/>
</svg>
